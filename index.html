<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <title>Reading list</title>
</head>
<body>
    <h1>Reading list</h1>
    <div>
        <h2>Books</h2>
        <ul></ul>
    </div>
    <div>
        <button id="new-book">New Book</button>

        <dialog>
            <button>Close</button>
            <form> 
                <h2>Add a new book to library</h2>
                <label for="title">Title</label>
                <input id="title" type="text" autofocus>
                
                <label for="author">Author</label>
                <input id="author" type="text">
                
                <label for="page">Page</label>
                <input id="page" type="number">

                <div>
                    <label for="finished">Finished?</label>
                    <input class="checkbox" id="finished" type="checkbox">
                </div>

                <button formmethod="dialog">Add book</button>
            </form>
        </dialog>
    </div>
</body>
</html>
